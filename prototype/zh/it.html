<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>身份与访问 · Global Mobility Assistant</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/shell.css" />
  <link rel="stylesheet" href="../shared/joule.css" />
  <link rel="stylesheet" href="../shared/guide.css" />
  <style>
    .journey-nav { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 10px 12px; background: #fff; border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 16px; align-items: center; }
    .journey-nav .step { padding: 5px 10px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; user-select: none; transition: background 0.12s, color 0.12s; }
    .journey-nav .step:hover { background: var(--joule-purple-soft); color: var(--joule-purple); }
    .journey-nav .step:active { transform: scale(0.98); }
    .journey-nav .step.active { background: var(--role-it); color: #fff; font-weight: 600; }
    .journey-nav .step.done { color: var(--status-green); }
    .journey-nav .step.pending { opacity: 0.9; }
    .journey-nav .step.pending:hover { opacity: 1; background: var(--joule-purple-soft); color: var(--joule-purple); }
    .journey-nav .step .n { width: 18px; height: 18px; border-radius: 50%; background: #EEF1F4; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
    .journey-nav .step.active .n { background: rgba(255,255,255,0.25); color: #fff; }
    .journey-nav .step.done .n { background: var(--status-green); color: #fff; }
    .journey-nav .sep { color: var(--border-mid); align-self: center; font-size: 11px; }
    .breadcrumb { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
    .breadcrumb a { color: var(--sap-blue); cursor: pointer; }
    .alert-row { cursor: pointer; }
    .alert-row.high { background: #FDF0EE; }
    .alert-row:hover { background: #F5F7FA; }
    .alert-row.high:hover { background: #FBE7E4; }
    .alert-row.readonly { cursor: default; opacity: 0.75; }
    .alert-row.readonly:hover td { background: #FAFBFC; }
    .preview-tag { display: inline-block; background: #EEF1F4; color: var(--text-muted); padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 6px; letter-spacing: 0.2px; }

    .diagnosis {
      background: #FDF6FE; border: 1px solid var(--joule-purple-border);
      border-left: 4px solid var(--joule-purple);
      padding: 14px 18px; border-radius: 6px; margin-bottom: 12px;
    }
    .diagnosis h4 { margin: 0 0 8px; color: var(--joule-purple-dark); font-size: 13px; }
    .diagnosis ol { margin: 6px 0 0 20px; padding: 0; }
    .diagnosis li { margin: 3px 0; font-size: 13px; }

    .health-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .health-cell { background: #FAFBFC; border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px; font-size: 12px; }
    .health-cell.degraded { background: #FEF6E6; border-color: #F0D797; }
    .health-cell .h-name { font-weight: 600; margin-bottom: 4px; }
    .health-cell .h-state { font-size: 11px; }
    .health-cell.degraded .h-state { color: #8A6100; font-weight: 600; }
    .health-cell.healthy .h-state { color: var(--status-green); font-weight: 600; }

    .dep-graph { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .dep-node { background: #FAFBFC; border: 1px solid var(--border-soft); border-radius: 6px; padding: 10px; font-size: 12px; position: relative; }
    .dep-node.confirmed { background: #F1F9F3; border-color: #C5E4CE; }
    .dep-node.failed { background: #FDECE9; border-color: #EFB4AC; }
    .dep-node.pending-dep { background: #F5F6F7; border-color: var(--border-mid); opacity: 0.75; }
    .dep-node .task-id { font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: var(--text-muted); }
    .dep-node .task-label { font-weight: 600; margin: 4px 0; font-size: 12.5px; }
    .dep-node .task-meta { color: var(--text-muted); font-size: 11px; }

    /* ============ Mobile adaptation · < 768px ============ */
    @media (max-width: 768px) {
      .journey-nav { padding: 8px 10px; gap: 4px; }
      .journey-nav .step { padding: 4px 8px; font-size: 11px; }
      .journey-nav .step .n { width: 16px; height: 16px; font-size: 10px; }
      .journey-nav .sep { display: none; }
      .breadcrumb { font-size: 12px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .dep-graph { grid-template-columns: 1fr; gap: 8px; }
      .health-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .health-cell { padding: 8px 10px; }
      .diagnosis { padding: 12px 14px; }
      .diagnosis h4 { font-size: 12.5px; }
    }
  </style>
</head>
<body class="role-it">
  <div id="topbarSlot"></div>

  <div class="app-shell">
    <main class="main-area joule-open" id="mainArea">
      <div class="journey-nav" id="journeyNav"></div>
      <div id="viewContainer"></div>
    </main>
  </div>

  <div id="jouleSlot"></div>

  <div class="global-footer">
    非 SAP 官方产品 · 学习原型 · 虚构数据与模拟执行 &nbsp;|&nbsp; Not an SAP official product · Learning prototype · 虚构数据与模拟执行
  </div>

  <script src="../shared/state.js"></script>
  <script src="../shared/topbar.js"></script>
  <script src="../shared/joule.js"></script>
  <script src="../shared/guide.js"></script>
  <script src="data/it-data.js"></script>
  <script>
  const D = window.IT_DATA;
  document.getElementById("topbarSlot").innerHTML = window.TOPBAR.renderTopbar("it");
  document.getElementById("jouleSlot").innerHTML = window.JOULE.jouleHTML("it", "Joule · 身份与访问");

  // Mount guidance layers
  window.GUIDE.injectGuideButton();
  window.GUIDE.mountGuideOverlay({ suppressAutoShow: true });
  window.GUIDE.mountRoleRibbon("it");

  // Step-appropriate hints
  function showStepHintIT(step) {
    if (step === "console") {
      setTimeout(() => window.GUIDE.showHint({
        id: "it-see-alert",
        title: "在等 HR 触发执行吗?",
        body: "高优告警会在 HR 触发林晨调动的执行后出现。如果你还没看到,请前往 HRBP 标签页 → 审批流 → 触发执行。",
        anchor: "bottom-right"
      }), 900);
    } else if (step === "diagnose") {
      setTimeout(() => window.GUIDE.showHint({
        id: "it-pause-3",
        title: "这就是第 3 处暂停",
        body: "Joule <b>本可以</b> 自动合并这些记录。但它没有 —— 因为账户关联属于治理决定,任何跨境影响都应交给法务 / 隐私专业人员判断。它只是观察,并做路由。",
        anchor: "top-right"
      }), 700);
    } else if (step === "receipt") {
      setTimeout(() => window.GUIDE.showHint({
        id: "it-log-routing",
        title: "注意这里的措辞",
        body: "按钮写的是 <b>把路由结果回执给 HR</b> —— 不是 “关闭告警” 或 “标为已解决”。本工具不会关闭这个案例;那是治理团队的事。",
        anchor: "top-right"
      }), 700);
    }
  }
  window.addEventListener("hashchange", () => showStepHintIT((location.hash || "#console").replace("#","")));
  showStepHintIT((location.hash || "#console").replace("#",""));

  const STEPS = [
    { id: "console",     n: 1, label: "告警控制台" },
    { id: "alertDetail", n: 2, label: "告警详情" },
    { id: "queue",       n: 3, label: "任务队列" },
    { id: "diagnose",    n: 4, label: "诊断与处置" },
    { id: "receipt",     n: 5, label: "提交回执" }
  ];

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function pill(cls, text) { return `<span class="pill ${cls}">${esc(text)}</span>`; }
  const jouleCtl = window.JOULE.bindJouleShell();
  let jouleExtra = [];

  function currentStepId() {
    const h = (location.hash || "#console").replace("#","");
    return STEPS.find(s => s.id === h) ? h : "console";
  }

  function stepStatus(stepId) {
    const s = window.GMA.loadState();
    const order = STEPS.map(x => x.id);
    const idx = order.indexOf(stepId);
    const cIdx = order.indexOf(currentStepId());
    if (stepId === "diagnose" && s.iasConflictResolved) return "done";
    if (stepId === "receipt" && s.receiptSubmitted) return "done";
    if (idx < cIdx) return "done";
    if (idx === cIdx) return "active";
    return "pending";
  }

  function renderNav() {
    const nav = document.getElementById("journeyNav");
    nav.innerHTML = "";
    STEPS.forEach((step, i) => {
      const status = stepStatus(step.id);
      const el = document.createElement("div");
      el.className = "step " + status;
      el.innerHTML = `<span class="n">${status === "done" ? "✓" : step.n}</span><span>${esc(step.label)}</span>`;
      el.addEventListener("click", () => { location.hash = "#" + step.id; });
      nav.appendChild(el);
      if (i < STEPS.length - 1) {
        const sep = document.createElement("span");
        sep.className = "sep"; sep.textContent = "›";
        nav.appendChild(sep);
      }
    });
  }

  // ============ Views ============
  function view_console() {
    const s = window.GMA.loadState();
    const showPrimary = s.executionStarted && s.provisioningIssue && !s.iasConflictResolved;
    const alerts = D.alerts.filter(a => a.primary ? showPrimary : true);

    return `
      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">告警控制台</h1>
          <div class="page-sub">已按你的租户过滤 · 点击高优告警打开详情</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" id="btnRefresh">🔄 刷新</button>
          <button class="btn outlined" id="btnResetAll">↺ 重置演示</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 1 步 · 告警控制台。</b>你的全球告警队列。HR 触发执行后,新的 IAS 冲突会出现在这里。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">系统健康</h2></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <div class="health-grid">
          ${D.systemHealth.map(h => {
            const sh = s.executionStarted && s.provisioningIssue && !s.iasConflictResolved ? h : { ...h, state: h.name === "身份服务 · 目标区域" ? "healthy" : h.state, note: h.name === "身份服务 · 目标区域" ? "无异常" : h.note };
            const stateLabel = sh.state === "degraded" ? "受影响" : sh.state === "healthy" ? "正常" : sh.state;
            return `<div class="health-cell ${sh.state}">
              <div class="h-name">${esc(sh.name)}</div>
              <div class="h-state">${sh.state === "degraded" ? "⚠ " : "● "}${esc(stateLabel)}</div>
              <div class="muted small mt-8">${esc(sh.note)}</div>
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">告警队列</h2>
          <div class="card-sub">${alerts.length} 条未处理告警</div></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <table class="data-table">
          <thead><tr><th>告警编号</th><th>严重级别</th><th>类型</th><th>影响对象</th><th>创建时间</th></tr></thead>
          <tbody>
            ${alerts.map(a => `<tr class="alert-row ${a.severity} ${a.primary ? "" : "readonly"}" data-alert="${esc(a.id)}">
              <td class="mono">${esc(a.id)}${a.primary ? "" : ' <span class="preview-tag">只读预览</span>'}</td>
              <td>${pill(a.severity === "high" ? "red" : a.severity === "medium" ? "yellow" : "grey", a.severity === "high" ? "高" : a.severity === "medium" ? "中" : "低")}</td>
              <td>${esc(a.type)}</td>
              <td class="mono">${esc(a.affects)}</td>
              <td class="muted">${esc(a.opened)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        ${!s.executionStarted ? `<div class="info-strip mt-16" style="margin-bottom:0"><span class="i-icon">i</span><div>等待 HR 触发执行 —— 当前没有 IAS 相关工作。</div></div>` : ""}
      </div>
    `;
  }

  function view_alertDetail() {
    const s = window.GMA.loadState();
    if (!s.executionStarted || !s.provisioningIssue || s.iasConflictResolved) {
      return `
        <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>告警详情</b></div>
        <div class="info-strip warn"><span class="i-icon">!</span><div>当前没有高优告警。HR 触发执行后,此步骤会开放。</div></div>
      `;
    }
    return `
      <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>ALT-2026-091501</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">ALT-2026-091501 · 身份映射待复核</h1>
          <div class="page-sub">高优 · 影响 EMP-CN-2381 · 2026-11-01 03:14 开启</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#console'">← 返回控制台</button>
          <button class="btn primary" onclick="location.hash='#queue'">查看依赖图 →</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 2 步 · 告警详情。</b>告警的上下文。下一步:查看哪些调动任务被暂停,并在路由前先看清观察结论。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">告警上下文</h2></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <ul class="kv-list">
          <li><span class="k">告警编号</span><span class="v mono">ALT-2026-091501</span></li>
          <li><span class="k">严重级别</span><span class="v">${pill("red","高")}</span></li>
          <li><span class="k">类型</span><span class="v">身份映射待复核</span></li>
          <li><span class="k">影响对象</span><span class="v mono">EMP-CN-2381(林晨)</span></li>
          <li><span class="k">关联调动</span><span class="v mono">${esc(s.moveRequestId)}</span></li>
          <li><span class="k">开启时间</span><span class="v">2026-11-01 03:14</span></li>
          <li><span class="k">源任务</span><span class="v mono">EXEC-04 · 身份供应 · 目标区域</span></li>
          <li><span class="k">下游被暂停</span><span class="v mono">EXEC-05, EXEC-06, EXEC-07, EXEC-08</span></li>
        </ul>
      </div>
    `;
  }

  function view_queue() {
    const s = window.GMA.loadState();
    const tasks = D.tasks.map(t => ({ ...t }));
    if (!s.executionStarted) {
      tasks.forEach(t => t.state = "pending-dep");
    } else if (s.iasConflictResolved) {
      const e4 = tasks.find(t => t.id === "EXEC-04");
      if (e4) e4.state = "pending-review";
    } else {
      const e4 = tasks.find(t => t.id === "EXEC-04");
      if (e4) e4.state = "pending-review";
    }

    return `
      <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <a onclick="location.hash='#alertDetail'">告警</a> › <b>任务队列</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">调动任务队列 · 依赖图</h1>
          <div class="page-sub">林晨(EMP-CN-2381)· 8 个任务 · 身份 / 访问 / SSO</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#alertDetail'">← 返回</button>
          <button class="btn primary" onclick="location.hash='#diagnose'">审查 →</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 3 步 · 任务队列。</b>已提交 ≠ 已核实 · 主体连续性 ≠ 所有账户不变。EXEC-04 暂停等待人工复核;下游 4 个任务随之暂停。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">依赖图</h2></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <div class="dep-graph">
          ${tasks.map(t => {
            const label = { confirmed: "✓ 已完成", "pending-review": "⚠ 待复核", "pending-dep": "⏳ 等待依赖" }[t.state] || t.state;
            const cls = { confirmed: "green", "pending-review": "yellow", "pending-dep": "grey" }[t.state] || "grey";
            const badge = pill(cls, label);
            const nodeCls = t.state === "pending-review" ? "failed" : t.state;
            return `<div class="dep-node ${nodeCls}">
              <div class="task-id">${esc(t.id)} · ${esc(t.system)}</div>
              <div class="task-label">${esc(t.label)}</div>
              <div class="task-meta">${esc(t.owner)}</div>
              <div class="mt-8">${badge}</div>
              ${t.deps.length ? `<div class="task-meta mt-8">依赖:${t.deps.map(esc).join(", ")}</div>` : ""}
            </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  function view_diagnose() {
    const s = window.GMA.loadState();
    if (!s.executionStarted || !s.provisioningIssue) {
      return `
        <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>诊断</b></div>
        <div class="info-strip warn"><span class="i-icon">!</span><div>当前没有需要诊断的 IAS 冲突。</div></div>
      `;
    }
    if (s.iasConflictResolved) {
      return `
        <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>已路由至治理复核</b></div>
        <div class="conclusion-banner">
          <div class="cb-icon">→</div>
          <div>
            <div class="cb-title">EXEC-04 已路由至身份治理团队</div>
            <div class="cb-sub">已请求人工复核。下游供应仍处于暂停状态。本工具不会关闭告警、也不会将案例标为已解决 —— 结论由治理团队做出。</div>
          </div>
        </div>
        <div class="row" style="justify-content:flex-end;">
          <button class="btn primary" onclick="location.hash='#receipt'">记录本次路由操作 →</button>
        </div>
      `;
    }
    const d = D.diagnosis;
    return `
      <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <a onclick="location.hash='#queue'">任务队列</a> › <b>审查</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">EXEC-04 · 等待人工复核</h1>
          <div class="page-sub">仅供观察 · 本工具不提议操作路径,也不解决该案例</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#queue'">← 返回队列</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 4 步 · 审查。</b>Joule 呈现观察结论并暂停。下一步 —— 这些记录是否属于同一个人、以及如何关联 —— 属于治理决定。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">观察结论 · 下一步该做什么</h2></div>
          <span class="cap-tag ext">项目扩展设计</span>
        </div>
        <div class="two-col">
          <div>
            <div class="bold mb-8">观察到的情况</div>
            <div class="muted" style="line-height:1.55;">${esc(d.observation)}</div>
            <div class="bold mt-16 mb-8">为什么在这里暂停</div>
            <div class="muted" style="line-height:1.55;">${esc(d.whyManual)}</div>
          </div>
          <div>
            <div class="diagnosis">
              <h4>下一步该做什么</h4>
              <ol>
                ${d.whatToDoNext.map(step => `<li>${esc(step)}</li>`).join("")}
              </ol>
            </div>
            <div class="muted small mt-8">
              <b>负责人 · 参考:</b>
              <ul style="margin:4px 0 0 18px; padding:0;">
                ${d.references.map(r => `<li>${esc(r)}</li>`).join("")}
              </ul>
            </div>
          </div>
        </div>
        <div class="info-strip warn mt-16">
          <span class="i-icon">!</span>
          <div><b>下游任务暂停:</b><span class="mono">${D.downstream.join(", ")}</span> —— 在治理决定被记录之前,将保持暂停。</div>
        </div>
        <div class="row mt-16">
          <div class="spacer"></div>
          <button class="btn outlined" id="btnEscalate">为治理团队补充上下文</button>
          <button class="btn primary" id="btnResolve">路由至身份治理团队</button>
        </div>
      </div>
    `;
  }

  function view_receipt() {
    const s = window.GMA.loadState();
    if (!s.iasConflictResolved) {
      return `
        <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>记录路由</b></div>
        <div class="info-strip warn"><span class="i-icon">!</span><div>请先把 EXEC-04 路由到身份治理团队,然后回到此处记录本次路由操作。</div></div>
      `;
    }
    return `
      <div class="breadcrumb"><a onclick="location.hash='#console'">告警控制台</a> › <b>记录路由</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">记录本次路由操作</h1>
          <div class="page-sub">通知 HR:该案例已被路由至治理复核 —— 并非已被解决</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#diagnose'">← 返回</button>
        </div>
      </div>

      <div class="info-strip ${s.receiptSubmitted ? "success" : ""}">
        <span class="i-icon">${s.receiptSubmitted ? "✓" : "i"}</span>
        <div><b>第 5 步 · 记录路由。</b>${s.receiptSubmitted ? "路由已记录。HR 看到的是案例在治理团队处 —— 而不是已关闭。" : "在下方确认,以记录本次路由操作。"}</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">路由说明 · 草稿</h2>
          <div class="card-sub">由 Joule 起草,由你签署。目标侧核实仍未到位。</div></div>
          <span class="cap-tag ext">项目扩展设计</span>
        </div>
        <ul class="kv-list">
          <li><span class="k">调动</span><span class="v mono">${esc(s.moveRequestId)}</span></li>
          <li><span class="k">员工</span><span class="v">EMP-CN-2381 · 林晨</span></li>
          <li><span class="k">EXEC-04</span><span class="v">${pill("yellow","已路由 · 等待治理决定")}</span></li>
          <li><span class="k">下游(EXEC-05 至 08)</span><span class="v">${pill("grey","暂停 · 决定 + 目标侧核实后恢复")}</span></li>
          <li><span class="k">告警</span><span class="v mono">ALT-2026-091501 · 开启中 · 审查中</span></li>
          <li><span class="k">给 HR 的说明</span><span class="v">案例出现多个候选身份记录;已路由至身份治理团队进行人工复核。本工具不做关联判断,也不关闭告警。</span></li>
        </ul>
        <div class="row mt-16">
          <div class="spacer"></div>
          ${s.receiptSubmitted
            ? `<button class="btn outlined" disabled>路由已记录 ✓</button>`
            : `<button class="btn primary" id="btnSubmitReceipt">把路由结果回执给 HR</button>`}
        </div>
      </div>
    `;
  }

  // ============ Render + bind ============
  function renderView() {
    const step = currentStepId();
    const view = { console: view_console, alertDetail: view_alertDetail, queue: view_queue, diagnose: view_diagnose, receipt: view_receipt }[step];
    document.getElementById("viewContainer").innerHTML = view();
    bindViewInteractions(step);
    renderNav();
    refreshJoule();
    refreshBadges();
  }

  function bindViewInteractions(step) {
    document.getElementById("btnRefresh")?.addEventListener("click", renderView);
    document.getElementById("btnResetAll")?.addEventListener("click", () => { window.GMA.resetState(); jouleExtra = []; renderView(); });

    if (step === "console") {
      document.querySelectorAll(".alert-row").forEach(r => {
        r.addEventListener("click", () => {
          const id = r.getAttribute("data-alert");
          if (id === "ALT-2026-091501") location.hash = "#alertDetail";
          // Non-primary alerts are read-only preview — no navigation
        });
      });
    }

    if (step === "diagnose") {
      document.getElementById("btnResolve")?.addEventListener("click", () => {
        window.GMA.mutateState(x => { x.iasConflictResolved = true; x.provisioningIssue = false; }, "it-routed-to-governance");
        jouleExtra.push({ role: "bot", html: `案例已路由至身份治理团队(模拟)。本工具不做关联判断、也不关闭告警 —— 等待治理团队的决定。`, sources: 1 });
        renderView();
      });
      document.getElementById("btnEscalate")?.addEventListener("click", () => alert("已为治理团队补充上下文(模拟)。本演示路径中不改变状态。"));
    }

    if (step === "receipt") {
      document.getElementById("btnSubmitReceipt")?.addEventListener("click", () => {
        window.GMA.mutateState(x => { x.receiptSubmitted = true; }, "it-logged-routing");
        jouleExtra.push({ role: "bot", html: `路由已记录。HR 看到的是案例在治理团队处 —— 而不是已关闭。`, sources: 1 });
        renderView();
      });
    }
  }

  // ============ Joule(IT)· 支持自动播放节奏 ============
  function jouleFramesFor(step) {
    const s = window.GMA.loadState();
    const active = s.executionStarted && s.provisioningIssue && !s.iasConflictResolved;
    const overview = { role: "bot", autoplay: true, delay: 300,
      html: `准备就绪,Tom。队列:2 条常规告警。${active ? "<strong>新的高优告警:</strong>林晨调动中的身份映射需要人工复核 —— 4 个下游任务被暂停。" : "当前没有高优告警。"}`, sources: 1 };

    switch (step) {
      case "console":
        return [ overview ];
      case "alertDetail":
        if (!active) return [ overview, { role: "bot", autoplay: true, delay: 400, html: `当前没有需要展开的告警。`, sources: 1 } ];
        return [ overview,
          { role: "bot", autoplay: true, delay: 700,
            html: `EXEC-04 需要人工复核。在治理决定被记录之前,4 个下游任务保持暂停。`, sources: 1 } ];
      case "queue":
        if (!s.executionStarted) return [ overview, { role: "bot", autoplay: true, delay: 400, html: `队列空闲。HR 触发执行后,依赖图会激活。`, sources: 1 } ];
        return [ overview,
          { role: "bot", autoplay: true, delay: 700,
            html: `是 EXEC-04 卡住了下游。我会告诉你我观察到什么 —— 下一步是治理决定,不是我建议的操作。`, sources: 1 } ];
      case "diagnose":
        if (s.iasConflictResolved) return [ overview, { role: "bot", autoplay: true, delay: 400, html: `案例已路由。等待治理决定 —— 我不会关闭它。`, sources: 1 } ];
        if (!active) return [ overview, { role: "bot", autoplay: true, delay: 400, html: `当前没有需要审查的案例。`, sources: 1 } ];
        return [ overview,
          { role: "bot", autoplay: true, delay: 600,
            html: `观察结论:自动身份映射返回了多条候选记录。我不会断言它们代表冲突,也不会提议操作路径。`, sources: 2 },
          { role: "bot", autoplay: false, continueLabel: "▸ 为什么我在这里停下",
            html: `这些记录是否属于同一个人、以及如何关联,属于 <strong>治理决定</strong> —— 其中任何数据保护或跨境合规审查,应由有资质的专业人员评估。我呈现观察并做路由;我不做处置。`, sources: 2 }];
      case "receipt":
        if (!s.iasConflictResolved) return [ overview, { role: "bot", autoplay: true, delay: 400, html: `还没到时候 —— 请先把案例路由给治理复核。`, sources: 1 } ];
        return [ overview,
          { role: "bot", autoplay: true, delay: 500,
            html: `路由说明已起草。请核对并签署;HR 看到的是案例在治理团队处 —— 而不是已关闭。`, sources: 1 } ];
    }
    return [ overview ];
  }

  function handleJouleAction() {}

  function refreshJoule() {
    document.getElementById("jouleTitle").textContent = "Joule · " + (STEPS.find(x => x.id === currentStepId())?.label || "身份与访问");
    const base = jouleFramesFor(currentStepId());
    const frames = base.concat(jouleExtra.map(f => ({ ...f, autoplay: f.autoplay !== undefined ? f.autoplay : true })));
    window.JOULE.loadSequence(frames, handleJouleAction);
    window.JOULE.setIntentRouter(itIntentRouter);
    window.JOULE.setSuggestions(itSuggestionsFor(currentStepId()));
  }

  function itSuggestionsFor(step) {
    switch (step) {
      case "console":     return ["有高优告警吗?", "系统健康状态如何?"];
      case "alertDetail": return ["观察到了什么?", "下游哪些任务被暂停?"];
      case "queue":       return ["哪个任务被暂停了?", "看依赖关系"];
      case "diagnose":    return ["你能自动处理吗?", "由谁来决定?"];
      case "receipt":     return ["路由说明里都写了什么?"];
      default: return [];
    }
  }

  function itIntentRouter(userText) {
    const t = userText.toLowerCase();
    const s = window.GMA.loadState();
    if (/high|severity|urgent|alert|高优|严重|告警/.test(t)) {
      if (s.provisioningIssue && !s.iasConflictResolved) return { html: `1 条 <strong>高优</strong>:林晨调动中的身份供应(EXEC-04)需要人工复核 —— 4 个下游任务被暂停。另有 1 条中优、1 条低优。`, sources: 2 };
      return { html: `没有高优告警。1 条中优(IPS 同步延迟),1 条低优(SSO 证书临近到期)。`, sources: 1 };
    }
    if (/system|health|tenant|系统|健康|租户/.test(t)) {
      return { html: `身份服务(目标区域)当前处于 <strong>受影响</strong> 状态,有 1 个案例等待人工复核。其余组件正常。`, sources: 1 };
    }
    if (/observed|what.*happen|why.*paused|multi|candidate|record|观察|多条|候选|记录/.test(t)) {
      return { html: `自动身份映射对用户 'lin.chen' 返回了多条候选记录。它们是否属于同一个人,应由身份治理团队判断 —— 我不会仅凭记录存在就下结论。`, sources: 2 };
    }
    if (/downstream|block|depend|graph|paused|下游|阻塞|依赖|暂停/.test(t)) {
      return { html: `EXEC-04 卡住了 <span class="mono">EXEC-05, EXEC-06, EXEC-07, EXEC-08</span> —— 属性同步、访问角色变更、首次登录核实。这些只会在治理决定 <em>且</em> 目标侧核实回执到位后才恢复。`, sources: 1 };
    }
    if (/auto|automatic|resolve|for me|do it|merge|自动|合并|替我/.test(t)) {
      return { html: `<strong>这一类案例我不会自动处理。</strong>跨区域的身份关联是治理决定,任何跨境影响都属于有资质的专业人员的判断范围。我呈现观察并做路由 —— 我不提议操作路径。`, sources: 2 };
    }
    if (/who|owner|decide|responsible|谁|决定|负责/.test(t)) {
      return { html: `身份治理团队拥有关联决定。任何数据保护或跨境影响,应由法务 / 隐私专业人员评估 —— 而不是由本工具处理。`, sources: 1 };
    }
    if (/receipt|submit|close|route|routing|回执|提交|关闭|路由/.test(t)) {
      if (!s.iasConflictResolved) return { html: `还没到时候 —— 请先把案例路由到治理团队。`, sources: 1 };
      return { html: `路由说明草稿已就绪。它记录:案例已路由至身份治理、下游任务保持暂停、告警在决定 + 目标侧核实到位前保持开启。请签署以把路由结果回执给 HR。`, sources: 1 };
    }
    return null;
  }


  function refreshBadges() {
    const s = window.GMA.loadState();
    let n = D.alerts.filter(a => !a.primary).length;
    if (s.executionStarted && s.provisioningIssue && !s.iasConflictResolved) n += 1;
    window.TOPBAR.setNotifBadge(n);
  }

  window.addEventListener("hashchange", renderView);
  window.GMA.onStateChange(renderView);
  window.GMA.loadState();
  renderView();
  </script>
</body>
</html>
