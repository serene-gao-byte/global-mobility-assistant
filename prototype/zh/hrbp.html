<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人才运营 · Global Mobility Assistant</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/shell.css" />
  <link rel="stylesheet" href="../shared/joule.css" />
  <link rel="stylesheet" href="../shared/guide.css" />
  <style>
    .journey-nav { display: flex; flex-wrap: wrap; gap: 2px 4px; padding: 10px 12px; background: #fff; border: 1px solid var(--border-soft); border-radius: 8px; margin-bottom: 16px; align-items: center; }
    .journey-nav .step { padding: 5px 10px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; user-select: none; transition: background 0.12s, color 0.12s; }
    .journey-nav .step:hover { background: #E8F4F5; color: var(--sap-teal); }
    .journey-nav .step:active { transform: scale(0.98); }
    .journey-nav .step.active { background: var(--sap-teal); color: #fff; font-weight: 600; }
    .journey-nav .step.done { color: var(--status-green); }
    .journey-nav .step.pending { opacity: 0.9; }
    .journey-nav .step.pending:hover { opacity: 1; background: #E8F4F5; color: var(--sap-teal); }
    .journey-nav .step .n { width: 18px; height: 18px; border-radius: 50%; background: #EEF1F4; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
    .journey-nav .step.active .n { background: rgba(255,255,255,0.25); color: #fff; }
    .journey-nav .step.done .n { background: var(--status-green); color: #fff; }
    .journey-nav .sep { color: var(--border-mid); align-self: center; font-size: 11px; }
    .breadcrumb { color: var(--text-secondary); font-size: 12px; margin-bottom: 12px; }
    .breadcrumb a { color: var(--sap-blue); cursor: pointer; }
    .queue-row { cursor: pointer; }
    .queue-row.selected { background: #E8F4F5 !important; }
    .queue-row.readonly { cursor: default; opacity: 0.75; }
    .queue-row.readonly:hover td { background: #FAFBFC; }
    .queue-row .flag { background: #FBE7E4; color: var(--status-red); padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 6px; }
    .preview-tag { display: inline-block; background: #EEF1F4; color: var(--text-muted); padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; margin-left: 6px; letter-spacing: 0.2px; }

    .expert-panel {
      background: #FDF6FE; border: 1px solid var(--joule-purple-border);
      border-left: 4px solid var(--joule-purple);
      border-radius: 6px; padding: 14px 16px; margin-top: 12px;
    }
    .expert-panel .exp-title { font-weight: 600; color: var(--joule-purple-dark); font-size: 13px; margin-bottom: 6px; }
    .expert-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(0,0,0,0.06); font-size: 13px; }
    .expert-row:last-child { border-bottom: none; }
    .expert-row .exp-name { font-weight: 500; }
    .expert-row .exp-note { color: var(--text-muted); font-size: 12px; }
    .avail-tag { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .avail-tag.available   { background: var(--status-green-bg); color: var(--status-green); }
    .avail-tag.constrained { background: var(--status-yellow-bg); color: var(--status-yellow); }
    .avail-tag.busy        { background: var(--status-red-bg); color: var(--status-red); }

    .signal-card {
      background: #FEF6E6; border: 1px solid #F0D797; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 16px;
    }
    .signal-card .s-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .signal-card .s-title { font-weight: 600; color: #6B4C00; }
    .signal-card .s-body { font-size: 13px; color: #6B4C00; }

    /* ============ Mobile adaptation · < 768px ============ */
    @media (max-width: 768px) {
      .journey-nav { padding: 8px 10px; gap: 4px; }
      .journey-nav .step { padding: 4px 8px; font-size: 11px; }
      .journey-nav .step .n { width: 16px; height: 16px; font-size: 10px; }
      .journey-nav .sep { display: none; }
      .breadcrumb { font-size: 12px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .queue-row .flag { display: block; margin-left: 0; margin-top: 2px; }
      .expert-panel { padding: 12px; }
      .expert-row { flex-direction: column; align-items: flex-start; gap: 4px; padding: 10px 0; }
      .avail-tag { font-size: 10px; padding: 2px 6px; }
      .signal-card { padding: 12px; }
      .signal-card .s-header { flex-direction: column; align-items: flex-start; gap: 6px; }
    }
  </style>
</head>
<body class="role-hrbp">
  <div id="topbarSlot"></div>

  <div class="app-shell">
    <main class="main-area joule-open" id="mainArea">
      <div class="journey-nav" id="journeyNav"></div>
      <div id="viewContainer"></div>
    </main>
  </div>

  <div id="jouleSlot"></div>

  <div class="global-footer">
    非 SAP 官方产品 · 学习原型 · 虚构数据与模拟执行 &nbsp;|&nbsp; Not an SAP official product · Learning prototype · 虚构数据与模拟执行
  </div>

  <script src="../shared/state.js"></script>
  <script src="../shared/topbar.js"></script>
  <script src="../shared/joule.js"></script>
  <script src="../shared/guide.js"></script>
  <script src="data/hrbp-data.js"></script>
  <script>
  const D = window.HRBP_DATA;
  document.getElementById("topbarSlot").innerHTML = window.TOPBAR.renderTopbar("hrbp");
  document.getElementById("jouleSlot").innerHTML = window.JOULE.jouleHTML("hrbp", "Joule · 人才运营");

  // Mount guidance layers
  window.GUIDE.injectGuideButton();
  window.GUIDE.mountGuideOverlay({ suppressAutoShow: true });
  window.GUIDE.mountRoleRibbon("hrbp");

  // Step-appropriate hints
  function showStepHintHRBP(step) {
    if (step === "inbox") {
      setTimeout(() => window.GUIDE.showHint({
        id: "hrbp-open-lin-chen",
        title: "试试看 —— 从这里开始",
        body: "点击 <b>林晨</b>(高优先级那一行)打开她的调动请求。然后走一遍影响审查 —— 那里是第 2 处暂停所在。",
        anchor: "bottom-right"
      }), 900);
    } else if (step === "impact") {
      setTimeout(() => window.GUIDE.showHint({
        id: "hrbp-route-specialist",
        title: "试试看 —— 第 2 处暂停",
        body: "点击 “薪资与福利” 那一行的 <b>路由到专业人员</b>。Joule 会按 职责 → 资质 → 授权 → 容量 排序做推荐 —— 但由你来决定。",
        anchor: "top-right"
      }), 700);
    } else if (step === "edit") {
      setTimeout(() => window.GUIDE.showHint({
        id: "hrbp-edit-date",
        title: "试试看 —— 关键字段变更",
        body: "修改生效日期。Joule 会指出谁需要重新签署,并把 Offer 标为需另行核对的事项 —— 绝不会断言 “不受影响”。",
        anchor: "top-right"
      }), 700);
    } else if (step === "approvals") {
      setTimeout(() => window.GUIDE.showHint({
        id: "hrbp-trigger-execution",
        title: "触发执行",
        body: "先提交审批,再触发执行。然后切换到 IT 标签页查看第 3 处暂停 —— 一个 Joule 拒绝自动化解决的身份冲突案例。",
        anchor: "bottom-right"
      }), 700);
    }
  }
  window.addEventListener("hashchange", () => showStepHintHRBP((location.hash || "#inbox").replace("#","")));
  showStepHintHRBP((location.hash || "#inbox").replace("#",""));

  const STEPS = [
    { id: "inbox",     n: 1, label: "调动收件箱" },
    { id: "detail",    n: 2, label: "请求详情" },
    { id: "impact",    n: 3, label: "影响审查" },
    { id: "edit",      n: 4, label: "编辑请求" },
    { id: "approvals", n: 5, label: "审批流" },
    { id: "handoff",   n: 6, label: "交接" }
  ];

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function pill(cls, text) { return `<span class="pill ${cls}">${esc(text)}</span>`; }

  // 单一判断源:当前是否可以提交审批?按钮、对话、提交处理函数全部据此判断,不再各写一套。
  function computeSubmitGate(s) {
    if (s.approvalsSubmitted) {
      return { canSubmit: false, code: "already-submitted", nextStep: "trigger-execution",
        reason: "本版本的审批已提交 —— 正在等待审批人处理。等他们回执后可以触发执行。" };
    }
    if (s.invalidatedByEdit && !s.v2Generated) {
      return { canSubmit: false, code: "needs-v2", nextStep: "generate-v2",
        reason: "生效日期已变更,原 v1 签署不再适用。请先(通过 Joule)生成 Move Request v2。" };
    }
    if (s.v2Generated && !s.v2Reconfirmed) {
      return { canSubmit: false, code: "needs-reconfirm", nextStep: "reconfirm-v2",
        reason: "日期已变更,原确认不再适用。v2 草稿已生成,但 3 位审批人尚未重新确认。请先完成当前版本的重新确认,再提交审批。" };
    }
    return { canSubmit: true, code: "ok", nextStep: "submit",
      reason: "Move Request 处于可提交状态。EC + MDF 两条流均已就绪。" };
  }
  const jouleCtl = window.JOULE.bindJouleShell();
  let jouleExtra = [];

  function currentStepId() {
    const h = (location.hash || "#inbox").replace("#","");
    return STEPS.find(s => s.id === h) ? h : "inbox";
  }

  function stepStatus(stepId) {
    const s = window.GMA.loadState();
    const order = STEPS.map(x => x.id);
    const currentIdx = order.indexOf(currentStepId());
    const idx = order.indexOf(stepId);
    if (stepId === "approvals" && s.approvalsSubmitted) return "done";
    if (stepId === "handoff" && (s.iasConflictResolved || (s.executionStarted && !s.provisioningIssue))) return "done";
    if (idx < currentIdx) return "done";
    if (idx === currentIdx) return "active";
    return "pending";
  }

  function renderNav() {
    const nav = document.getElementById("journeyNav");
    nav.innerHTML = "";
    STEPS.forEach((step, i) => {
      const status = stepStatus(step.id);
      const el = document.createElement("div");
      el.className = "step " + status;
      el.innerHTML = `<span class="n">${status === "done" ? "✓" : step.n}</span><span>${esc(step.label)}</span>`;
      el.addEventListener("click", () => { location.hash = "#" + step.id; });
      nav.appendChild(el);
      if (i < STEPS.length - 1) {
        const sep = document.createElement("span");
        sep.className = "sep"; sep.textContent = "›";
        nav.appendChild(sep);
      }
    });
  }

  // ============ Views ============
  function view_inbox() {
    return `
      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">调动请求 · 收件箱</h1>
          <div class="page-sub">队列视图 · 点击任一请求打开详情</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" id="btnRefresh">🔄 刷新</button>
          <button class="btn outlined" id="btnResetAll">↺ 重置演示</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 1 步 · 调动请求。</b>你正在处理的队列。Joule 会标记异常 —— 使既有签署失效的关键字段变更、或专业人员的瓶颈。</div>
      </div>

      ${renderSignalCards()}

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">我的调动请求队列</h2>
          <div class="card-sub">4 个进行中的请求 · 1 个高优先级</div></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <table class="data-table" id="queueTable">
          <thead><tr><th>请求编号</th><th>员工</th><th>路径</th><th>阶段</th><th>优先级</th></tr></thead>
          <tbody>
            ${D.queue.map(q => `<tr class="queue-row ${q.primary ? "selected" : "readonly"}" data-req="${esc(q.id)}">
              <td class="mono">${esc(q.id)}${q.primary ? "" : ' <span class="preview-tag">只读预览</span>'}</td>
              <td>${esc(q.employee)}${q.flag === "key-field-change" ? '<span class="flag">关键字段变更</span>' : ""}</td>
              <td>${esc(q.route)}</td>
              <td>${esc(q.stage)}</td>
              <td>${pill(q.priority === "high" ? "red" : q.priority === "medium" ? "yellow" : "grey", q.priority === "high" ? "高" : q.priority === "medium" ? "中" : "低")}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function renderSignalCards() {
    const s = window.GMA.loadState();
    const sigs = (s.signals || []).filter(sig => sig.to === "hrbp" && !sig.acked);
    if (!sigs.length) return "";
    return sigs.map(sig => `
      <div class="signal-card">
        <div class="s-header">
          <div class="s-title">📨 来自员工的信号 · ${esc(sig.summary)}</div>
          <span class="cap-tag ext">项目扩展设计</span>
        </div>
        <div class="s-body">
          发送方:<b>${esc(sig.from === "employee" ? "林晨(Lin Chen)" : sig.from)}</b> · 类型:<span class="chip">${esc(sig.kind)}</span>
          <div class="mt-8 muted">员工的原话保留在其个人记录里。这里只是一个提示 —— 不构成承诺。做任何改动之前,先联系员工本人。</div>
          <div class="row mt-16">
            <div class="spacer"></div>
            <button class="btn outlined sm" data-ack-sig="${esc(sig.timestamp)}">已联系员工 · 确认收到</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  function view_detail() {
    const s = window.GMA.loadState();
    const l = D.linChen;
    const versionLabel = s.v2Generated ? (s.v2Reconfirmed ? "v2 · 已重新确认" : "v2 · 待重新确认") : (s.invalidatedByEdit ? "v1 · 已失效" : "v1 · 2026-09-05 已确认");
    const versionCls = s.v2Generated ? (s.v2Reconfirmed ? "blue" : "yellow") : (s.invalidatedByEdit ? "red" : "green");

    return `
      <div class="breadcrumb"><a onclick="location.hash='#inbox'">调动请求</a> › <b>${esc(l.name)}</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">${esc(l.name)} · ${esc(l.posTitle)}</h1>
          <div class="page-sub">${esc(l.sourceEntity)} → ${esc(l.targetEntity)} · ${pill(versionCls, versionLabel)}</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#inbox'">← 返回收件箱</button>
          <button class="btn primary" onclick="location.hash='#impact'">影响审查 →</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 2 步 · 请求详情。</b>结构化的 Move Request。修改任一关键字段时,Joule 会标记谁需要重新确认。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">调动请求 · ${esc(s.moveRequestId)}</h2></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <ul class="kv-list">
          <li><span class="k">员工</span><span class="v">${esc(l.name)} · ${esc(l.empId)}</span></li>
          <li><span class="k">申请 / 岗位需求</span><span class="v mono">${esc(l.appId)} · ${esc(l.reqId)}</span></li>
          <li><span class="k">路径</span><span class="v">${esc(l.sourceEntity)} → ${esc(l.targetEntity)}</span></li>
          <li><span class="k">当前经理</span><span class="v">${esc(l.sourceManager)}</span></li>
          <li><span class="k">目标经理</span><span class="v">${esc(l.targetManager)}</span></li>
          <li><span class="k">生效日期</span><span class="v">${esc(s.effectiveDate)} <span class="chip">关键字段</span></span></li>
          <li><span class="k">v1 审批人</span><span class="v">${l.v1ApprovedBy.map(esc).join(" · ")}</span></li>
        </ul>
      </div>
    `;
  }

  function view_impact() {
    const s = window.GMA.loadState();
    const routed = s.specialistsRouted || {};
    const stateMap = {
      "verified-sim": ["green","已核实(模拟)"],
      "pending":      ["yellow","待处理"],
      "blocked":      ["red","阻塞"],
      "n/a":          ["grey","不适用"]
    };

    return `
      <div class="breadcrumb"><a onclick="location.hash='#inbox'">调动请求</a> › <a onclick="location.hash='#detail'">林晨</a> › <b>影响审查</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">影响审查 · 路由给专业人员</h1>
          <div class="page-sub">跨系统清单 · 将 “待处理” 的事项分派给专业人员</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#detail'">← 返回</button>
          <button class="btn primary" onclick="location.hash='#edit'">继续:编辑请求 →</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 3 步 · 影响审查。</b>跨系统的 9 项清单。Joule 知道每个专业人员类型都有谁 —— 试着路由一项,看它如何做推荐。</div>
      </div>

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">跨系统影响清单</h2>
          <div class="card-sub">“未知” 不会默认通过 · 带有专业人员类型的行,右侧会有 “路由” 按钮</div></div>
          <span class="cap-tag ext">项目扩展设计</span>
        </div>
        <table class="data-table">
          <thead><tr><th>领域</th><th>状态</th><th>负责人</th><th>操作</th></tr></thead>
          <tbody>
            ${D.impactChecklist.map(x => {
              const [pcls, plabel] = stateMap[x.status] || ["grey", x.status];
              const isRouted = x.specialistKey && routed[x.specialistKey];
              const action = x.specialistKey
                ? (isRouted ? pill("green","已路由") : `<button class="btn outlined sm" data-route="${esc(x.specialistKey)}">路由到专业人员</button>`)
                : `<span class="muted">—</span>`;
              return `<tr>
                <td>${esc(x.area)}<div class="muted small mt-8">${esc(x.verify)}</div></td>
                <td>${pill(pcls, plabel)}</td>
                <td>${esc(x.owner)}</td>
                <td>${action}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  function view_edit() {
    const s = window.GMA.loadState();
    const alertHTML = s.invalidatedByEdit && !s.v2Generated
      ? `<div class="info-strip danger"><span class="i-icon">!</span><div><b>v1 已失效。</b>使用右侧 Joule 生成 v2,并通知审批人。</div></div>`
      : s.v2Generated && !s.v2Reconfirmed
      ? `<div class="info-strip warn"><span class="i-icon">!</span><div><b>Move Request v2 已生成。</b>已向 3 位审批人发送重新确认请求(模拟)。在审批步骤收到重新确认后,审批流才会解锁。</div></div>`
      : s.v2Generated && s.v2Reconfirmed
      ? `<div class="info-strip success"><span class="i-icon">✓</span><div><b>Move Request v2 已重新确认。</b>现在可以在审批步骤提交审批。</div></div>`
      : "";

    return `
      <div class="breadcrumb"><a onclick="location.hash='#inbox'">调动请求</a> › <a onclick="location.hash='#detail'">林晨</a> › <b>编辑请求</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">修改关键字段</h1>
          <div class="page-sub">修改生效日期会使既有签署失效,需要重新确认</div>
        </div>
        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#impact'">← 返回</button>
          <button class="btn primary" onclick="location.hash='#approvals'">继续:审批流 →</button>
        </div>
      </div>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 4 步 · 编辑请求。</b>修改关键字段会通知 Joule,由它解释哪些人会受影响、并提出重新确认的流程。</div>
      </div>

      ${alertHTML}

      <div class="card">
        <div class="card-header">
          <div><h2 class="card-title">生效日期</h2></div>
          <span class="cap-tag native">标准业务功能模拟</span>
        </div>
        <div class="row wrap">
          <span class="k" style="width:auto;">当前值:</span>
          <input id="effDateInput" type="date" value="${esc(s.effectiveDate)}" style="padding:6px 10px; border:1px solid var(--border-mid); border-radius:4px; font-family:inherit; font-size:13px;" />

  function view_approvals() {
    const s = window.GMA.loadState();
    const rows = D.approvals.map(a => {
      // 版本标签与 Move Request 版本绑定,与提交/通过状态无关。
      let ver = s.v2Generated ? (a.flow.startsWith("EC") ? "MoveRequest v2" : "MDF v2") : a.version;
      // 状态单独计算,提交/通过绝不重置版本标签。
      let st = a.status;
      if (s.invalidatedByEdit && !s.v2Generated) st = "已阻塞 — v1 失效";
      else if (s.v2Generated && !s.approvalsSubmitted) st = s.v2Reconfirmed ? "已重新确认 · 待提交" : "等待 v2 重新确认";
      else if (s.approvalsSubmitted && a.status.startsWith("pending")) st = s.approvalsApproved ? "已通过(模拟)" : "已提交(模拟)";
      const cls = st.startsWith("已通过") || st.startsWith("approved") ? "green" : st.startsWith("已阻塞") ? "red" : st.startsWith("已提交") ? "blue" : st.startsWith("已重新确认") ? "blue" : "yellow";
      const stLabel = st === "approved" ? "已通过" : st === "pending-submit" ? "待提交" : st;
      return `<tr>
        <td>${esc(a.flow)}</td><td>${esc(ver)}</td><td>${pill(cls, stLabel)}</td><td class="muted">${esc(a.owners)}</td>
      </tr>`;
    }).join("");

    const gate = computeSubmitGate(s);
    const canSubmit = gate.canSubmit;
    const canTrigger = s.approvalsSubmitted && s.approvalsApproved && !s.executionStarted;

    const approveControl = needsApprove
      ? `<div class="info-strip mt-16" style="margin-bottom:0; background:#F3EEFB; border-color:var(--joule-purple-border); color:var(--joule-purple-dark);">
           <span class="i-icon" style="background:var(--joule-purple);">▸</span>
           <div>
             <b>演示控制 · 模拟审批人回执通过。</b>
             这代表 3 位审批人在各自队列里通过了 EC + MDF —— <b>不是</b> HR 替他们审批。只有审批回执通过后,才能触发执行。
             <div class="row mt-8"><div class="spacer"></div>
               <button class="btn outlined sm" id="btnSimApprove">标记 EC + MDF 已由审批人通过(演示)</button>
             </div>
           </div>
         </div>`
      : "";
      <div class="breadcrumb"><a onclick="location.hash='#inbox'">调动请求</a> › <a onclick="location.hash='#detail'">林晨</a> › <b>审批流</b></div>

      <div class="page-header">
        <div class="page-title-wrap">
          <h1 class="page-title">审批流</h1>
          <div class="page-sub">招聘/Offer 与 EC/MDF 是独立的流程 · 审批版本与 Move Request 版本绑定</div>

        <div class="page-actions">
          <button class="btn outlined" onclick="location.hash='#edit'">← 返回</button>
          <button class="btn primary" onclick="location.hash='#handoff'">前往交接 →</button>

      <div class="info-strip">
        <span class="i-icon">i</span>
        <div><b>第 5 步 · 审批流。</b>先提交审批 · 通过后触发执行 · 在里程碑轨道观察 IT 侧的进度。</div>

      <div class="card">

          <div><h2 class="card-title">审批流</h2></div>

          <div>${esc(D.performancePrepAgent.note)}</div>

  // ============ Render + bind ============
  function renderView() {
    const step = currentStepId();
    const view = { inbox: view_inbox, detail: view_detail, impact: view_impact, edit: view_edit, approvals: view_approvals, handoff: view_handoff }[step];
    document.getElementById("viewContainer").innerHTML = view();
    bindViewInteractions(step);
    renderNav();
    refreshJoule();
    refreshBadges();
  }

  function bindViewInteractions(step) {
    document.getElementById("btnRefresh")?.addEventListener("click", renderView);
    document.getElementById("btnResetAll")?.addEventListener("click", () => { window.GMA.resetState(); jouleExtra = []; renderView(); });

    if (step === "inbox") {
      document.querySelectorAll(".queue-row").forEach(r => {
        r.addEventListener("click", () => {
          const id = r.getAttribute("data-req");
          if (id === "DEMO-REQ-2026-MV-0071") location.hash = "#detail";
          // Non-primary rows are read-only preview — no action, tag already shows why
        });
      });
      document.querySelectorAll("[data-ack-sig]").forEach(b => {
        b.addEventListener("click", () => {
          const ts = b.getAttribute("data-ack-sig");
          window.GMA.mutateState(x => {
            const sig = x.signals.find(s => s.timestamp === ts);
            if (sig) sig.acked = true;
          }, "hrbp-acked-signal");
          jouleExtra.push({ role: "bot", html: `信号已确认收到。真实产品中,这里会打开日程流程去联系员工 —— 但不会替员工做任何自动化承诺。`, sources: 1 });
          renderView();
        });
      });
    }

    if (step === "impact") {
      document.querySelectorAll("[data-route]").forEach(b => {
        b.addEventListener("click", () => {
          const key = b.getAttribute("data-route");
          window.GMA.mutateState(x => { x.specialistsRouted[key] = true; }, "hrbp-routed-specialist");
          // Recommendation follows: responsibility → qualification → authorization → capacity
          const experts = D.experts[key];
          if (experts) {
            const recommended = experts.candidates.find(c => c.availability === "available") || experts.candidates[0];
            jouleExtra.push({
              role: "user", autoplay: true, delay: 300,
              text: "把这一项路由给专业人员。"
            });
            jouleExtra.push({
              role: "bot",
              html: `<strong>这是推荐,不是决定。</strong>在覆盖这项职责、拥有所需资质、且在该员工授权范围内的候选人中,我找到 <strong>${esc(recommended.name)}</strong>。当前状态:${esc(recommended.availability)} · ${esc(recommended.note)}。是否派发,由你决定。`,
              sources: 2
            });
          }
          renderView();
        });
      });
    }

    if (step === "edit") {
      document.getElementById("applyEffDate")?.addEventListener("click", () => {
        const newVal = document.getElementById("effDateInput").value;
        const s = window.GMA.loadState();
        if (!newVal || newVal === s.effectiveDate) return;
        const oldVal = s.effectiveDate;
        window.GMA.mutateState(x => {
          x.effectiveDate = newVal;
          x.invalidatedByEdit = true;
          x.v2Generated = false;
          x.v2Reconfirmed = false;
          x.approvalsSubmitted = false;
          x.approvalsApproved = false;
        }, "hrbp-changed-effective-date");
        addEditExchange(oldVal, newVal);
        jouleCtl.open();
        renderView();
      });
    }

    if (step === "approvals") {
      document.getElementById("btnSimReconfirm")?.addEventListener("click", () => {
        const s = window.GMA.loadState();
        // 仅在 v2 已生成但尚未重新确认时有效。绝不清除任何失效状态。
        if (!(s.v2Generated && !s.v2Reconfirmed)) { renderView(); return; }
        window.GMA.mutateState(x => { x.v2Reconfirmed = true; }, "hrbp-v2-reconfirmed-sim");
        jouleExtra.push({ role: "bot", html: `已记录 3 位审批人对 v2 的重新确认(演示)。Move Request v2 现在可以提交。这反映的是审批人在各自队列里的确认 —— 不是 HR 替他们签署。`, sources: 1 });
        renderView();
      });
      document.getElementById("btnSubmitApprovals")?.addEventListener("click", () => {
        // 点击时按最新状态重新判断 —— 不信任禁用属性或旧对话里的判断。
        const s = window.GMA.loadState();
        const gate = computeSubmitGate(s);
        if (!gate.canSubmit) {
          jouleExtra.push({ role: "bot", html: `暂时无法提交。${esc(gate.reason)}`, sources: 1 });
          renderView();
          return;
        }
        window.GMA.mutateState(x => { x.approvalsSubmitted = true; }, "hrbp-submitted-approvals");
        jouleExtra.push({ role: "bot", html: `审批已提交 —— 现在交由 3 位审批人处理(EC + MDF)。<strong>尚未通过审批,调动也尚未生效。</strong>下一步:审批人在各自队列里处理;他们回执后,你可以触发执行。`, sources: 1 });
        renderView();
      });
      document.getElementById("btnSimApprove")?.addEventListener("click", () => {
        const s = window.GMA.loadState();
        // 仅在已提交、尚未通过、尚未执行时有效。代表 3 位审批人回执通过。
        if (!(s.approvalsSubmitted && !s.approvalsApproved && !s.executionStarted)) { renderView(); return; }
        window.GMA.mutateState(x => { x.approvalsApproved = true; }, "hrbp-approvals-approved-sim");
        jouleExtra.push({ role: "bot", html: `3 位审批人已对 EC + MDF 回执<strong>通过</strong>(演示)。现在可以触发执行。这反映的是审批人在各自队列里的处理 —— 不是 HR 替他们审批。`, sources: 1 });
        renderView();
      });
      document.getElementById("btnTriggerExec")?.addEventListener("click", () => {
        const s = window.GMA.loadState();
        if (!(s.approvalsSubmitted && s.approvalsApproved && !s.executionStarted)) { renderView(); return; }
        window.GMA.mutateState(x => { x.executionStarted = true; x.provisioningIssue = true; }, "hrbp-triggered-execution");
        jouleExtra.push({ role: "bot", html: `执行已触发。IT 团队正在接手供应工作。如有异常我会通知你。`, sources: 1 });
        renderView();
      });
    }
  }

  // ============ Joule(HRBP)· 支持自动播放节奏 ============
  function addEditExchange(oldDate, newDate) {
    jouleExtra.push({ role: "user", autoplay: true, delay: 400,
      text: `把生效日期从 ${oldDate} 改为 ${newDate}。` });
    jouleExtra.push({
      role: "bot", autoplay: false, continueLabel: "▸ 查看此变更的影响",
      html: `检测到 <strong>关键字段变更</strong>。这会使 Move Request v1 失效。<strong>3 位审批人</strong> 需要重新确认:<ul><li>HRBP(源国 · 你本人)· v1 已作废</li><li>Payroll ME · 检查 ${esc(newDate)} 是否影响薪资截止节点</li><li>Global Mobility · 检查搬迁与签证时序影响</li></ul><strong>需另行核对:</strong>招聘 Offer v2 —— 日期变更是否影响 Offer,取决于其内容与所适用的流程;请与招聘经理确认,不要默认 “不受影响”。<br><br>是否 <strong>生成 Move Request v2</strong> 并通知 3 位审批人?`,
      actions: [
        { label: "✓ 生成 v2 · 通知 3 位审批人", kind: "primary", event: "generate-v2" },
        { label: "✗ 取消变更 · 恢复为 " + oldDate, event: "cancel-change", meta: oldDate }
      ],
      sources: 3
    });
  }

  function jouleFramesFor(step) {
    const s = window.GMA.loadState();
    const hasSignal = (s.signals||[]).some(x => x.to === "hrbp" && !x.acked);
    const overview = { role: "bot", autoplay: true, delay: 300,
      html: `早上好,Mira。当前 4 个进行中的请求 · 1 个高优先级(林晨)。${hasSignal ? " <strong>你有一条来自员工的新信号。</strong>" : ""}`, sources: 2 };
    if (step === "inbox") {
      const frames = [overview];
      if (hasSignal) {
        frames.push({ role: "bot", autoplay: false, continueLabel: "▸ 解读这条信号",
          html: `员工提示了可能的时序调整。她的原话保留在她的记录里 —— 你看到的只是一个抽象化的提示。做任何改动之前,先和她沟通。`, sources: 1 });
      }
      return frames;
    }
    if (step === "detail") return [overview,
      { role: "bot", autoplay: true, delay: 600,
        html: `林晨的 Move Request 处于 <strong>${s.invalidatedByEdit && !s.v2Generated ? "v1 已失效" : (s.v2Generated ? (s.v2Reconfirmed ? "v2 已重新确认" : "v2 待重新确认") : "v1 已确认")}</strong>。字段齐全。`, sources: 1 }];
    if (step === "impact") return [overview,
      { role: "bot", autoplay: true, delay: 700,
        html: `跨系统的 9 项清单。3 项可路由到专业人员。`, sources: 2 },
      { role: "bot", autoplay: false, continueLabel: "▸ 我的推荐是如何筛选的",
        html: `我给推荐,你做决定。筛选顺序是 <strong>职责 → 资质 → 授权 → 容量</strong>:先要求专业人员类型能覆盖该职责,其次要求持有所需资质,然后要求在该员工的授权范围内;在剩下的候选人中,当前容量只是一个参考信号。试着路由 “薪资与福利” 看看这个过程。`, sources: 2 }];
    if (step === "edit") return [overview,
      { role: "bot", autoplay: true, delay: 500,
        html: `在左侧修改生效日期。我会明确告诉你 —— 谁需要重新签署、谁不受影响。`, sources: 1 }];
    if (step === "approvals") return [overview,
      { role: "bot", autoplay: true, delay: 500,
        html: `三条独立的审批流(招聘/EC/MDF)。我不会替你审批 —— 但字段变更导致既有签署失效时,我会捕捉到。`, sources: 1 }];
    if (step === "handoff") {
      const delayed = s.executionStarted && s.provisioningIssue && !s.iasConflictResolved;
      return [overview,
        { role: "bot", autoplay: true, delay: 500,
          html: delayed ? `IT 正在处理一个供应异常。员工侧只看到一个柔和的 “进行中” 提示。HR 无需操作。` : (s.executionStarted ? `交接已完成。` : `暂未开始 —— 等待执行触发。`), sources: 1 }];
    }
    return [overview];
  }

  function handleJouleAction(ev, meta) {
    if (ev === "generate-v2") {
      window.GMA.mutateState(x => { x.v2Generated = true; x.v2Reconfirmed = false; }, "hrbp-generated-v2");
      jouleExtra.push({ role: "user", autoplay: true, delay: 300, text: "生成 v2 并通知他们。" });
      jouleExtra.push({ role: "bot", autoplay: true, delay: 700,
        html: `完成。Move Request <strong>v2 草稿已创建</strong>;重新确认请求已发送给 3 位审批人。<strong>生成 v2 草稿不等于他们已经重新确认</strong> —— 在 3 位审批人于审批步骤重新确认之前,审批保持锁定。`, sources: 2 });
      renderView();
    } else if (ev === "cancel-change") {
      window.GMA.mutateState(x => { x.effectiveDate = meta; x.invalidatedByEdit = false; x.v2Generated = false; x.v2Reconfirmed = false; }, "hrbp-cancelled-change");
      jouleExtra.push({ role: "bot", autoplay: true, delay: 500,
        html: `已恢复。v1 的确认继续有效。`, sources: 1 });
      renderView();
    } else if (ev === "goto-impact") { location.hash = "#impact"; }
    else if (ev === "goto-edit") { location.hash = "#edit"; }
    else if (ev === "goto-approvals") { location.hash = "#approvals"; }
  }

  function refreshJoule() {
    document.getElementById("jouleTitle").textContent = "Joule · " + (STEPS.find(x => x.id === currentStepId())?.label || "人才运营");
    const base = jouleFramesFor(currentStepId());
    const frames = base.concat(jouleExtra.map(f => ({ ...f, autoplay: f.autoplay !== undefined ? f.autoplay : true })));
    window.JOULE.loadSequence(frames, handleJouleAction);
    window.JOULE.setIntentRouter(hrbpIntentRouter);
    window.JOULE.setSuggestions(hrbpSuggestionsFor(currentStepId()));
  }

  function hrbpSuggestionsFor(step) {
    switch (step) {
      case "inbox":     return ["今天有哪些高优先级?", "有员工发来的信号吗?"];
      case "detail":    return ["当前版本状态是什么?", "谁签署了 v1?"];
      case "impact":    return ["谁来审核薪资相关?", "哪些项被阻塞了?"];
      case "edit":      return ["如果改动日期会怎样?"];
      case "approvals": return ["现在可以提交审批吗?", "EC 流程为什么被阻塞?"];
      case "handoff":   return ["IT 侧有异常吗?", "还有需要我操作的吗?"];
      default: return [];
    }
  }

  function hrbpIntentRouter(userText) {
    const t = userText.toLowerCase();
    const s = window.GMA.loadState();
    if (/priority|urgent|high|today|优先|紧急|今天/.test(t)) {
      return { html: `<strong>林晨(上海 → 利雅得)</strong>是你今天唯一的高优先级。另外 3 个中/低优先级的请求进度正常。${(s.signals||[]).some(x=>x.to==="hrbp"&&!x.acked) ? "此外,你的收件箱里还有 <strong>1 条来自员工的信号</strong>。" : ""}`, sources: 2 };
    }
    if (/signal|employee.*(note|flag|message)|信号|员工.*(反馈|留言|提示)/.test(t)) {
      const has = (s.signals||[]).some(x=>x.to==="hrbp"&&!x.acked);
      return { html: has ? `有 —— 林晨提示了可能的时序调整。收件箱顶部会显示黄色卡片。<strong>她的原话保留在个人记录里</strong>;这里只展示抽象化的提示。` : `目前没有待处理的信号。`, sources: 1 };
    }
    if (/version|v1|v2|invalidat|版本|失效/.test(t)) {
      const label = s.v2Generated ? (s.v2Reconfirmed ? "v2 已重新确认" : "v2 待重新确认") : s.invalidatedByEdit ? "v1 已失效" : "v1 已确认";
      const note = s.v2Generated
        ? (s.v2Reconfirmed ? "3 位审批人已重新确认 v2 —— 可以提交审批。" : "v2 草稿已生成;在提交审批之前,3 位审批人仍需重新确认。")
        : s.invalidatedByEdit ? "你需要先生成 v2,审批才能继续。" : "3 位审批人全部已签署。";
      return { html: `Move Request 当前状态:<strong>${label}</strong>。${note}`, sources: 1 };
    }
    if (/payroll|route|specialist|expert|assign|薪资|路由|专业人员|派发/.test(t)) {
      return { html: `对于 “薪资与福利”,我的推荐顺序是 <strong>职责 → 资质 → 授权 → 容量</strong>。在覆盖该职责且持有授权的候选人中,Payroll ME 当前有 3 项待处理;Global Mobility(Nikola)现在有档期。我建议先派 Global Mobility —— 但这只是推荐,拍板由你来。`, actions: [{ label: "打开影响审查", event: "goto-impact" }], sources: 2 };
    }
    if (/block|stuck|wait|阻塞|卡住|等待/.test(t)) {
      return { html: `DRTM(国别特定的数据保留期)标记为 <strong>阻塞</strong> —— 需要沙特侧的具体决策,超出本演示范围。其余项均为待处理或已核实。`, sources: 1 };
    }
    if (/submit|approve|approval|提交|审批/.test(t)) {
      const gate = computeSubmitGate(s);
      if (gate.code === "already-submitted") return { html: `已提交 —— 现在交由 3 位审批人处理。尚未通过审批,调动也尚未生效。他们回执后可以触发执行。`, sources: 1 };
      if (!gate.canSubmit) return { html: esc(gate.reason), sources: 1 };
      return { html: `可以 —— ${esc(gate.reason)}`, actions: [{ label: "打开审批流", event: "goto-approvals" }], sources: 1 };
    }
    if (/it|technical|conflict|ias|技术|冲突|身份/.test(t)) {
      if (s.provisioningIssue && !s.iasConflictResolved) return { html: `IT 侧提交了一个身份映射案例给治理团队复核。在治理团队处理期间,HR 侧无需操作。员工侧只看到一个柔和的 “待核实” 提示。`, sources: 1 };
      if (s.iasConflictResolved) return { html: `IT 已把身份案例路由给治理复核。在治理决定被记录、且目标侧核实回执到位之前,交接 <strong>不</strong> 会标记为完成。`, sources: 1 };
      return { html: `目前 IT 侧没有异常。`, sources: 1 };
    }
    if (/change.*(date|effective)|key.*field|生效日期|关键字段/.test(t)) {
      return { html: `修改生效日期会使 v1 失效,并要求 3 位审批人重新确认。我会明确指出:谁受影响、哪些签署仍有效。`, actions: [{ label: "打开编辑请求", event: "goto-edit" }], sources: 1 };
    }
    return null;
  }


  function refreshBadges() {
    const s = window.GMA.loadState();
    let n = D.queue.length;
    if (s.invalidatedByEdit && !s.v2Generated) n += 1;
    n += (s.signals || []).filter(x => x.to === "hrbp" && !x.acked).length;
    window.TOPBAR.setNotifBadge(n);
  }

  window.addEventListener("hashchange", renderView);
  window.GMA.onStateChange(renderView);
  window.GMA.loadState();
  renderView();
  </script>
</body>
</html>
